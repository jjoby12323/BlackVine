name: Deploy to RPi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/angoor_pi/blackvine

    steps:
      - name: Pull latest code
        run: git pull

      - name: Install dependencies
        run: venv/bin/pip install -r requirements.txt --quiet

      - name: Restart service
        # Requires: angoor_pi ALL=(ALL) NOPASSWD: /bin/systemctl restart blackvine
        run: sudo systemctl restart blackvine
